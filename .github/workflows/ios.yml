name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & unit test
    # xcode-27: the routine scan (Feature 20) compiles against the iOS 27 FoundationModels
    # SDK — image APIs that don't exist in the iOS 26 SDK. GitHub marks this image as
    # "preview" (it ships Xcode 27.0 beta and can queue slowly); if it turns flaky, go back
    # to `macos-26` AND restore the `#if compiler(>=6.4)` guards around RoutineScanAI.swift,
    # RoutineScanSupport and ScanEvaluationTests, which compiled the feature out on Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # No SwiftPM cache on purpose. Caching needs the checkouts at a stable
      # path, and both ways of getting one break the Firebase Crashlytics
      # build phase:
      #   -clonedSourcePackagesDirPath  moves them out of DerivedData, but the
      #     phase resolves its upload script via "${BUILD_DIR%/Build/*}/SourcePackages"
      #     and can no longer find it.
      #   -derivedDataPath ios/...      keeps them where the phase looks, but
      #     the script is then outside the sandbox's allowed reads and Xcode
      #     denies it (the phase declares no inputs).
      # Working around either one costs more than the cold resolve saves on a
      # public repo, where runner minutes are free.

      # Resolved from whatever the image actually ships rather than pinned to a
      # device name, so a runner image bump doesn't turn into a red build.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::No iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # UI tests are excluded wholesale (OnboardingUITests has a known
      # intra-suite ordering flake).
      #
      # Snapshot suites are excluded too, and that is a deliberate trade-off, not
      # a TODO. Their reference PNGs are byte-compared against a render produced by
      # one specific simulator — device size, screen scale and the OS's own font
      # metrics all bake into the image. The step above picks whatever iPhone the
      # runner image happens to ship, so a runner bump would fail these tests for
      # environmental reasons with no regression behind it. Pinning a simulator
      # instead would trade that for a red build every time the image drops the
      # pinned device.
      # They still run locally, where the recording environment is the asserting
      # environment. Add new snapshot suites to the skip list below.
      - name: Test
        run: |
          set -o pipefail
          cmd=(
            xcodebuild test
            -project ios/MuscleCheck.xcodeproj
            -scheme MuscleCheck
            -destination "id=${{ steps.sim.outputs.udid }}"
            -resultBundlePath TestResults.xcresult
            -only-testing:MuscleCheckTests
            -skip-testing:MuscleCheckTests/CalendarDayCellSnapshotTests
            CODE_SIGNING_ALLOWED=NO
          )
          if command -v xcbeautify >/dev/null 2>&1; then
            "${cmd[@]}" | xcbeautify
          else
            "${cmd[@]}"
          fi

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          retention-days: 7
